name: Test, and deploy on request

# Tests run on every push and pull request. Deploying to GitHub Pages is
# manual (Actions tab -> Run workflow) and should stay that way until the
# Bodleian confirms reuse terms for the catalogue text: bodleian/medieval-mss
# has no LICENSE file, and GitHub Pages sites are public on every plan except
# Enterprise Cloud, even when the repository itself is private.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Build tests
        run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Game logic tests
        working-directory: site
        run: node --test test/*.test.js
      - name: Data files are present and non-trivial
        run: |
          for f in puzzles context lookalikes; do
            test -s "site/data/$f.json" || { echo "missing site/data/$f.json"; exit 1; }
          done
          python - <<'PY'
          import json, pathlib
          puzzles = json.loads(pathlib.Path("site/data/puzzles.json").read_text())
          assert len(puzzles) > 2000, f"only {len(puzzles)} puzzles"
          assert all(p["iiif"] and p["catalogue"] for p in puzzles), "a puzzle is missing links"
          print(f"{len(puzzles)} puzzles OK")
          PY

  deploy:
    # Never on push: publishing is a deliberate act, not a side effect of saving work.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
